spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/restaurant
    username: restaurant
    password: restaurant
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info