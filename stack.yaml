version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7-alpine
    networks:
      - restaurant-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: restaurant
      RABBITMQ_DEFAULT_PASS: restaurant
    ports:
      - "15672:15672"
    networks:
      - restaurant-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: restaurant-orders-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/restaurant
      SPRING_DATASOURCE_USERNAME: restaurant
      SPRING_DATASOURCE_PASSWORD: restaurant
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: restaurant
      SPRING_RABBITMQ_PASSWORD: restaurant
    networks:
      - restaurant-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  frontend:
    image: nginx:alpine
    configs:
      - source: frontend_index
        target: /usr/share/nginx/html/index.html
    networks:
      - restaurant-net
    deploy:
      replicas: 1

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
      - source: frontend_index
        target: /usr/share/nginx/html/index.html
    networks:
      - restaurant-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - restaurant-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
    networks:
      - restaurant-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:

networks:
  restaurant-net:
    driver: overlay
    attachable: true

configs:
  nginx_config:
    file: ./nginx/nginx.conf
  frontend_index:
    file: ./frontend/index.html
  prometheus_config:
    file: ./prometheus/prometheus.yml
  grafana_datasource:
    file: ./grafana/datasources/datasource.yml